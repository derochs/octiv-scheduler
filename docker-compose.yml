services:
  octiv-booker:
    container_name: octiv-scheduler
    build:
      context: .
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - OCTIV_EMAIL=${OCTIV_EMAIL}
      - OCTIV_PASSWORD=${OCTIV_PASSWORD}
      - DISCOVERY_CRON=${DISCOVERY_CRON:-0 4 * * *}
      - DRY_RUN=${DRY_RUN:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
    volumes:
      - ./wishlist.json:/app/wishlist.json
